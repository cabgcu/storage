<style>
:root{
  --bg:#0A0A0C;
  --glass:rgba(255,255,255,.07);
  --glass-2:rgba(255,255,255,.11);
  --edge:rgba(255,255,255,.14);
  --edge-2:rgba(255,255,255,.28);
  --txt:#FFFFFF; --txt-2:rgba(255,255,255,.66); --txt-3:rgba(255,255,255,.42);
  --grape:#7C4DD1; --grape-2:#9B6FE8;
  --red:#FF6B5E; --green:#3FCF8E;
  --top:env(safe-area-inset-top); --bot:env(safe-area-inset-bottom);
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:none}
body{
  background:var(--bg); color:var(--txt); font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100dvh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--grape-2);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.mono{font-family:var(--mono)}

/* ---------- background video ---------- */
.bgv,.bgtint{position:fixed;inset:0;z-index:-2}
.bgv{width:100%;height:100%;object-fit:cover;filter:saturate(1.05)}
.bgtint{z-index:-1;background:
  radial-gradient(90% 60% at 50% 0%, rgba(124,77,209,.22), transparent 70%),
  linear-gradient(180deg, rgba(10,10,12,.62) 0%, rgba(10,10,12,.80) 45%, rgba(10,10,12,.94) 100%)}

/* ---------- shared glass ---------- */
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.3)}

/* ---------- login ---------- */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
  padding:calc(var(--top) + 32px) 20px calc(var(--bot) + 32px);max-width:460px;margin:0 auto;text-align:center}
.avatar{width:104px;height:104px;border-radius:50%;overflow:hidden;margin:0 auto 20px;
  border:2px solid rgba(255,255,255,.5);box-shadow:0 0 0 6px rgba(255,255,255,.06),0 20px 50px -18px #000;
  animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.login h1{font-size:clamp(30px,8.5vw,40px)}
.login .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--txt-3);margin:0 0 12px}
.login .sub{color:var(--txt-2);margin:12px auto 26px;max-width:30ch;font-size:14.5px}
.tags{display:flex;gap:12px}
.tag{flex:1;border-radius:20px;padding:20px 14px 18px;text-align:center;color:var(--txt);
  background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:transform .2s cubic-bezier(.2,.9,.3,1.1),background .2s,border-color .2s;
  animation:rise .5s cubic-bezier(.2,.9,.3,1.1) both}
.tag:nth-child(2){animation-delay:.08s}
.tag:active{transform:scale(.98)}
.tag[aria-pressed="true"]{background:linear-gradient(180deg,rgba(124,77,209,.42),rgba(124,77,209,.22));
  border-color:rgba(155,111,232,.75);box-shadow:0 14px 34px -16px rgba(124,77,209,.9)}
.tag .role{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.tag .who{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);margin-top:6px}
.tag .can{display:block;font-size:12.5px;color:var(--txt-2);margin-top:10px;line-height:1.4}
.form-wrap{margin-top:22px;text-align:left;animation:rise .3s ease both}
.f{margin-bottom:12px}
.f label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-3);margin-bottom:7px}
.f input{width:100%;padding:15px 16px;border-radius:15px;background:rgba(255,255,255,.06);
  border:1px solid var(--edge);color:var(--txt);backdrop-filter:blur(14px)}
.f input::placeholder{color:rgba(255,255,255,.3)}
.f input:focus{border-color:var(--grape-2);outline:none;background:rgba(255,255,255,.1)}
.go{width:100%;min-height:54px;padding:16px;border-radius:16px;font-size:16px;font-weight:700;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--grape-2),var(--grape));color:#fff;
  box-shadow:0 14px 30px -14px rgba(124,77,209,.9);transition:.15s}
.go:active{transform:scale(.99);filter:brightness(.94)}
.err{color:var(--red);font-size:13.5px;margin:0 0 10px}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--txt-3);margin-top:16px;line-height:1.8;text-align:center}

/* ---------- shell ---------- */
.bar{position:sticky;top:0;z-index:30;padding-top:var(--top);
  background:rgba(10,10,12,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(255,255,255,.08)}
.bar-in{display:flex;align-items:center;gap:11px;padding:11px 16px;max-width:900px;margin:0 auto}
.bar .mk{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:0 0 auto;border:1px solid var(--edge-2)}
.bar .mk img{width:100%;height:100%;object-fit:cover;display:block}
.bar .nm{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.bar .rl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3)}
.sp{flex:1}
.out-btn{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-2);
  padding:10px 12px;border-radius:11px;border:1px solid var(--edge);background:var(--glass)}
.out-btn:active{background:var(--glass-2)}
main{max-width:900px;margin:0 auto;padding:24px 16px calc(var(--bot) + 108px)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 14px);z-index:40;display:flex;gap:4px;
  padding:6px;border-radius:22px;background:rgba(18,18,22,.72);border:1px solid var(--edge);
  backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);
  box-shadow:0 20px 44px -18px #000}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:17px;color:var(--txt-3);transition:.15s}
.nav button .ic{position:relative;font-size:18px;line-height:1}
.nav button .lb{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.nav button[aria-current="true"]{color:#fff;background:linear-gradient(180deg,rgba(124,77,209,.5),rgba(124,77,209,.24));
  border:1px solid rgba(155,111,232,.4)}
.nav .pip{position:absolute;top:-5px;left:13px;min-width:17px;height:17px;border-radius:99px;background:var(--grape-2);

/* =======================================================
   Storage
   ======================================================= */
const SKEY = "canyon-cab-session:v11";
// Session ("who's signed in on this device") stays on-device — only the
// shared inventory itself lives in Supabase.
const sessionStore = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
};

const ITEM_COLS = ["id","name","cat","unit","shelf","team","notes","contents","emoji","out","flag","log"];
const rowToItem = r => ({ id: r.id, name: r.name, cat: r.cat, unit: r.unit, shelf: r.shelf,
  team: r.team || "", notes: r.notes || "", contents: r.contents || "", emoji: r.emoji || "",
  out: r.out || null, flag: r.flag || null, log: r.log || [] });
const itemToRow = it => ({ id: it.id, name: it.name, cat: it.cat, unit: it.unit, shelf: it.shelf,
  team: it.team || "", notes: it.notes || "", contents: it.contents || "", emoji: it.emoji || "",
  out: it.out || null, flag: it.flag || null, log: it.log || [] });

let synced = new Map(); // id -> JSON snapshot of the last state we know is in Supabase
async function loadItems(){
  const { data, error } = await sb.from("items").select(ITEM_COLS.join(",")).order("id");
  if (error){ console.error("load items failed", error); return S.items; }
  const items = data.map(rowToItem);
  synced = new Map(items.map(it => [it.id, JSON.stringify(it)]));
  return items;
}

let tmr = null, refreshPending = false;
function save(){
  clearTimeout(tmr);
  tmr = setTimeout(async () => {
    tmr = null;
    await syncItems();
    if (refreshPending){ refreshPending = false; await refreshFromServer(); }
  }, 200);
}
async function syncItems(){
  const seen = new Set(), upserts = [];
  for (const it of S.items){
    seen.add(it.id);
    const snap = JSON.stringify(it);
    if (synced.get(it.id) !== snap){ upserts.push(itemToRow(it)); synced.set(it.id, snap); }
  }
  const removed = [...synced.keys()].filter(id => !seen.has(id));
  removed.forEach(id => synced.delete(id));
  try{
    if (upserts.length) await sb.from("items").upsert(upserts);
    if (removed.length) await sb.from("items").delete().in("id", removed);
  }catch(e){ console.error("sync to supabase failed", e); }
}
async function refreshFromServer(){
  S.items = await loadItems();
  render();
}
sb.channel("items-sync")
  .on("postgres_changes", { event: "*", schema: "public", table: "items" }, () => {
    if (tmr){ refreshPending = true; return; } // finish flushing our own edit first
    refreshFromServer();
  })
  .subscribe();

const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const todayISO = () => iso(new Date());
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";

function emojiFor(it){
  if (it.emoji) return it.emoji;
  const n = String(it.name || "").toLowerCase();
  for (const [re, e] of NAME_EMOJI) if (re.test(n)) return e;
  return CAT_EMOJI[it.cat] || "\u{1F4E6}";
}
function buildSeed(){
  return SEED.map((r, i) => {
    const note = r[5] || "";
    const listy = /,|includes/i.test(note);          // notes that are really box contents
    return { id: "CAB-" + String(i + 1).padStart(4, "0"), name: r[0].trim(), cat: r[1],
      unit: r[2], shelf: r[3], team: r[4] || "",
      notes: listy ? "" : note, contents: listy ? note.replace(/^includes\s*/i, "") : "",
      emoji: "", out: null, flag: null, log: [] };
  });
}
function logIt(it, text){
  it.log = it.log || [];
  it.log.push({ at: todayISO(), text });
  if (it.log.length > 40) it.log = it.log.slice(-40);
}
const lastHands = it => (it.log || []).filter(l => /checked out by/i.test(l.text)).slice(-3).reverse();

/* ---------- search ---------- */
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const wordsOf = s => norm(s).split(" ").filter(Boolean);
const expand = q => wordsOf(q).map(t => SYN[t] ? [t, ...wordsOf(SYN[t])] : [t]);
function lev1(a, b){
  if (a === b) return true;
  const d = a.length - b.length;
  if (d > 1 || d < -1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++edits > 1) return false;
    if (d === 1) i++; else if (d === -1) j++; else { i++; j++; }
  }
  return true;
}
function ctxFor(it){
  const name = norm(it.name), unit = String(it.unit || "").toLowerCase();
  return { name, unit, nameW: name.split(" ").filter(Boolean),
    catW: wordsOf(CATS[it.cat] || ""),
    inW: wordsOf(it.contents || ""),
    restW: [...wordsOf(it.notes), ...wordsOf(it.team), unit, unit + it.shelf, "shelf"] };
}
function termScore(alt, ctx){
  let best = 0;
  for (const t of alt){
    let s = 0;
    if (t.length === 1) s = ctx.unit === t ? 6 : 0;
    else if (ctx.nameW.includes(t)) s = 12;
    else if (ctx.nameW.some(w => w.startsWith(t))) s = 10;
    else if (t.length >= 4 && ctx.name.includes(t)) s = 7;
    else if (ctx.inW.some(w => w.startsWith(t))) s = 6;          // what's inside the box
    else if (ctx.catW.some(w => w.startsWith(t))) s = 5;
    else if (ctx.restW.some(w => w.startsWith(t))) s = 4;
    else if (t.length >= 4 && ctx.nameW.some(w => lev1(w, t))) s = 3;
    if (s > best) best = s;
  }
  return best;
}
function scoreItem(it, groups){
  const ctx = ctxFor(it);
  let total = 0;
  for (const g of groups){ const s = termScore(g, ctx); if (!s) return 0; total += s; }
  return total;
}
function searchItems(q){
  const groups = expand(q);
  if (!groups.length) return [];
  return S.items.map(it => ({ it, s: scoreItem(it, groups) })).filter(r => r.s > 0)
    .sort((a, b) => b.s - a.s || a.it.name.localeCompare(b.it.name)).map(r => r.it);
}
function browseItems(){
  if (!S.browse) return [];
  const [kind, val] = S.browse;
  return S.items.filter(i => kind === "shelf" ? i.unit === val : i.cat === +val)
    .sort((a, b) => (a.shelf - b.shelf) || a.name.localeCompare(b.name));
}
const outItems = () => S.items.filter(i => i.out).sort((a, b) => (isLate(b) - isLate(a)) || a.name.localeCompare(b.name));
const myItems = () => outItems().filter(i => i.out.by === S.user.name);
const flagged = () => S.items.filter(i => i.flag);
const usedCats = () => [...new Set(S.items.map(i => i.cat))].sort((a, b) => CATS[a].localeCompare(CATS[b]));

/* A-Z buckets for the audit list */
function byLetter(list){
  const g = {};
  list.slice().sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase())).forEach(i => {
    const c = (i.name.trim()[0] || "#").toUpperCase();
    const k = /[A-Z]/.test(c) ? c : "#";
    (g[k] = g[k] || []).push(i);
  });
  return Object.keys(g).sort().map(k => [k, g[k]]);
}
/* group any list of items by shelf, in walking order */
function byShelf(list){
  const g = {};
  list.forEach(i => { const k = shelfOf(i); (g[k] = g[k] || []).push(i); });
  return Object.keys(g).sort().map(k => [k, g[k].sort((a, b) => a.name.localeCompare(b.name))]);
}

    ${it.notes ? `<p class="note">${esc(it.notes)}</p>` : ""}
    ${it.flag ? `<div class="flagbar"><span>⚑</span><span><b>${esc(it.flag.type)}</b>
      ${it.flag.note ? esc(it.flag.note) + "<br>" : ""}<small>${esc(it.flag.by)} · ${fmtDate(it.flag.at)}</small></span></div>` : ""}
    ${!gone && it.flag && (it.flag.type === "Damaged" || it.flag.type === "Missing")
      ? `<div class="out">Not usable right now<small>Reported ${esc(it.flag.type.toLowerCase())} by ${esc(it.flag.by)} \u00b7 ${fmtDate(it.flag.at)}</small></div>` : ""}
    ${gone
      ? `<div class="out ${mine ? "mine" : ""}">${mine ? "You have this out" : "Out with " + esc(it.out.by.split(" ")[0])}
          <small>${esc(it.out.by)} · ${fmtDate(it.out.at)}</small>
          <span class="due ${late ? "late" : ""}">${late ? "Overdue since " + fmtDate(it.out.at) : "Back tonight"}</span></div>
         <button class="act in" style="margin-top:10px" data-sheet="checkin:${it.id}">Check back in</button>`
      : (it.flag && (it.flag.type === "Damaged" || it.flag.type === "Missing"))
        ? "" : `<button class="act" data-sheet="checkout:${it.id}">Check out</button>`}
    <div class="iconrow">
      <button class="ib" data-sheet="report:${it.id}"><span class="g">⚑</span>${it.flag && isStaff() ? "Resolve" : "Report"}</button>
      <button class="ib" data-sheet="history:${it.id}"><span class="g">🕘</span>Who had it</button>
      ${isStaff() ? `<button class="ib" data-sheet="edit:${it.id}"><span class="g">✎</span>Edit</button>` : ""}
    </div>
  </article>`;
}
/* compact row used by put-away, audit, bulk move */
function row(it, right){
  return `<div class="row"><span class="rg">${emojiFor(it)}</span>
    <span class="rt"><b>${esc(it.name)}</b><small>${shelfOf(it)}${it.out ? " · out with " + esc(it.out.by.split(" ")[0]) : ""}</small></span>
    ${right || ""}</div>`;
}

function searchView(){

  const hits = searching ? searchItems(S.q) : browseItems();

    <h1 class="big-q">What are you looking for?</h1>
    <div class="qbox"><span class="mag">⌕</span>
      <input id="q" type="search" value="${esc(S.q)}" placeholder="Christmas tree, ping pong balls…" autocomplete="off" autocapitalize="none"></div>
    ${searching ? "" : `
      <p class="chips-label">Browse a shelf</p>
      <div class="chips">${UNITS.map(u => `<button class="chip" data-browse="shelf:${u}" aria-pressed="${bk === "shelf" && bv === u}">Shelf ${u}</button>`).join("")}</div>
      <p class="chips-label">Browse a category</p>
      <div class="chips">${usedCats().map(c => `<button class="chip" data-browse="cat:${c}" aria-pressed="${bk === "cat" && +bv === c}">${emojiFor({cat:c,name:""})} ${esc(CATS[c].split(" / ")[0])}</button>`).join("")}</div>`}
    ${searching
      ? `<p class="qmeta">${hits.length} match${hits.length === 1 ? "" : "es"}</p>
         ${hits.length ? `<div class="results">${hits.map(card).join("")}</div>`

      : S.browse
        ? `<p class="qmeta">${hits.length} item${hits.length === 1 ? "" : "s"} ${bk === "shelf" ? "on Shelf " + bv : "in " + esc(CATS[+bv])}</p>
           <div class="results">${hits.map(card).join("")}</div>`
        : `<div class="empty"><b>${S.items.length} items on file</b>Search a name or what's inside a box — "ping pong" finds the bin it lives in.</div>`}`;
}

function awayView(){
  const list = outItems();
  const groups = byShelf(list);
  return `<div class="sec-h"><h2>Put it away</h2><span>${list.length} item${list.length === 1 ? "" : "s"} · walk the row in order</span></div>
    ${list.length ? groups.map(([sh, l]) => `
      <div class="grp"><div class="grph"><b>Shelf ${sh}</b><span>${l.length} item${l.length === 1 ? "" : "s"}</span>
        <button class="mini ok" data-inshelf="${sh}">Put all back</button></div>
        ${l.map(i => row(i, `<button class="mini ok" data-in="${i.id}">Done</button>`)).join("")}</div>`).join("")
      : `<div class="empty"><b>All clear</b>Nothing left to put away.</div>`}`;
}

function outView(){
  const list = outItems(), late = list.filter(isLate).length;
  const mine = list.filter(i => i.out.by === S.user.name);
  const theirs = list.filter(i => i.out.by !== S.user.name);
  const people = [...new Set(theirs.map(i => i.out.by))].length;
  return `<div class="sec-h"><h2>Checked out</h2>
      <span>${list.length} item${list.length === 1 ? "" : "s"} out${late ? " · " + late + " overdue" : ""}${people ? " \u00b7 " + people + (people === 1 ? " person" : " people") : ""}</span></div>
    ${list.length ? `<button class="go" style="margin-bottom:16px" data-page="away">Put it away →</button>` : ""}
    ${mine.length ? `<p class="chips-label" style="margin-top:0">In your hands</p>
      <div class="results" style="margin-top:10px">${mine.map(card).join("")}</div>` : ""}
    ${theirs.length ? `<p class="chips-label">Out with everyone else</p>
      <div class="results" style="margin-top:10px">${theirs.map(card).join("")}</div>` : ""}
    ${list.length ? "" : `<div class="empty"><b>Everything is home</b>Nothing is signed out right now.</div>`}`;
}

function issuesView(){
  const list = flagged();
  return `<div class="sec-h"><h2>Reported issues</h2><span>${list.length} item${list.length === 1 ? "" : "s"} flagged</span></div>
    ${list.length ? `<div class="results">${list.map(card).join("")}</div>`
      : `<div class="empty"><b>Nothing flagged</b>Anything reported damaged or missing shows up here.</div>`}`;
}

function moreView(){
  const items = isStaff()
    ? [["list","📋","Full item list","Every item and where it lives"],
       ["add","＋","Add an item","Put something new on a shelf"],
       ["audit","✓","Audit a shelf","Walk it, tick what's there"],
       ["bulk","⇄","Bulk move","Reshelve a lot at once"],
       ["issues","⚑","Issues",flagged().length + " flagged"],
       ["sync","⇅","Import / export","Paste the sheet, or take it with you"]]
    : [["list","📋","Full item list","Every item and where it lives"],
       ["away","🎒","Put it away","Walk the row in shelf order"],
       ["sync","⇅","Export","Download the list as a spreadsheet"]];
  return `<div class="sec-h"><h2>More</h2><span>${esc(S.user.name)} · ${esc(S.user.team || "")}${S.user.position && S.user.position !== "Team Member" ? " · " + esc(S.user.position) : ""}</span></div>
    <div class="menu">${items.map(m => `<button data-page="${m[0]}">
      <span class="mi">${m[1]}</span><span class="mt"><b>${m[2]}</b><small>${esc(m[3])}</small></span><span class="ma">›</span>
    </button>`).join("")}</div>`;
}

function listView(){
  const checking = !!S.check;
  const q = S.lq.trim().toLowerCase();
  let list = S.items.slice();
  if (q) list = list.filter(i => (i.name + " " + (i.contents || "") + " " + (CATS[i.cat] || "")).toLowerCase().includes(q));
  if (S.lf === "out") list = list.filter(i => i.out);
  if (S.lf === "flag") list = list.filter(i => i.flag);
  if (S.lf === "gone") list = list.filter(i => S.check && S.check[i.id] === "no");
  if (S.lf === "todo") list = list.filter(i => S.check && !S.check[i.id]);
  const az = S.lsort === "az";
  const groups = az ? byLetter(list) : byShelf(list);
  const marks = S.check || {};
  const missing = Object.values(marks).filter(v => v === "no").length;
  const done = Object.keys(marks).length;
  return `<div class="sec-h"><h2>Full list</h2><span>${S.items.length} items · ${byShelf(S.items).length} shelves${checking ? " · checking" : ""}</span></div>
    <button class="${checking ? "ghost" : "go"}" style="margin:0 0 12px" data-act="${checking ? "checkstop" : "checkstart"}">${checking ? "Stop checking" : "Start a check"}</button>
    <div class="qbox" style="margin-bottom:12px"><span class="mag">⌕</span>
      <input id="lq" type="search" value="${esc(S.lq)}" placeholder="Filter the list…" autocomplete="off" autocapitalize="none"></div>
    <div class="chips" style="margin-bottom:10px">
      <button class="chip" data-lsort="shelf" aria-pressed="${!az}">By shelf</button>
      <button class="chip" data-lsort="az" aria-pressed="${az}">A \u2192 Z</button>
    </div>
    <div class="chips">
      <button class="chip" data-lf="all" aria-pressed="${S.lf === "all"}">All ${S.items.length}</button>
      <button class="chip" data-lf="out" aria-pressed="${S.lf === "out"}">Out now ${S.items.filter(i => i.out).length}</button>
      <button class="chip" data-lf="flag" aria-pressed="${S.lf === "flag"}">Flagged ${flagged().length}</button>
      ${checking ? `<button class="chip" data-lf="gone" aria-pressed="${S.lf === "gone"}">Can't find ${missing}</button>
      <button class="chip" data-lf="todo" aria-pressed="${S.lf === "todo"}">Not checked ${S.items.length - done}</button>` : ""}
    </div>
    ${checking ? `<div class="prog" style="margin:14px 0 0"><i style="width:${S.items.length ? done / S.items.length * 100 : 0}%"></i></div>` : ""}
    <div class="listwrap" style="margin-top:16px">
      ${groups.length ? groups.map(([sh, l]) => `
        <div class="grp"><div class="grph"><b>${az ? sh : "Shelf " + sh}</b><span>${l.length} item${l.length === 1 ? "" : "s"}</span></div>
          ${l.map(i => listRow(i)).join("")}</div>`).join("")
        : `<div class="empty"><b>Nothing matches</b>Try a different word or clear the filter.</div>`}
    </div>
    ${checking ? `<div class="checkbar"><span><b>${done}</b> of ${S.items.length} checked${missing ? " · " + missing + " missing" : ""}</span>
      <button class="mini no" data-act="checkfinish" style="min-width:112px">Finish</button></div>` : ""}`;
}
function listRow(it){
  const mark = S.check ? S.check[it.id] : null, gone = mark === "no";
  return `<div class="lrow ${gone ? "gone" : ""} ${mark === "yes" ? "ok" : ""}">
    <span class="rg">${emojiFor(it)}</span>
    <span class="rt"><b>${esc(it.name)}</b><small>${shelfOf(it)}${it.contents ? " · " + esc(it.contents.slice(0, 40)) : ""}</small></span>
    ${S.check ? `<span class="marks">
        <button class="mini ok ${mark === "yes" ? "on" : ""}" data-mark2="${it.id}:yes">Here</button>
        <button class="mini no ${gone ? "on" : ""}" data-mark2="${it.id}:no">Nope</button></span>`
      : it.out ? `<span class="tagx">out · ${esc(it.out.by.split(" ")[0])}</span>`
      : it.flag ? `<span class="tagx bad">${esc(it.flag.type)}</span>` : `<span class="tagx ok">here</span>`}
  </div>`;
}
function finishCheck(){
  const ids = Object.keys(S.check || {}).filter(k => S.check[k] === "no");
  const real = ids.map(byId).filter(i => i && !i.out);
  real.forEach(i => {
    i.flag = { type: "Missing", note: "Not found during the " + fmtDate(todayISO()) + " inventory check", by: S.user.name, at: todayISO() };
    logIt(i, "Not found at inventory check");
  });
  const wereOut = ids.length - real.length;
  S.check = null; S.lf = "all"; S.page = real.length ? "issues" : "list"; save(); render();
  toast(real.length + " flagged missing" + (wereOut ? " · " + wereOut + " were checked out" : ""));
}
function auditView(){
  const a = S.audit;
  if (!a) return `<div class="sec-h"><h2>Audit a shelf</h2><span>Tick off what's actually there</span></div>
    <div class="empty" style="margin-top:0"><b>Pick a shelf to walk</b>Twenty shelves, a few minutes each.</div>
    <div class="chips" style="flex-wrap:wrap">${UNITS.flatMap(u => SHELVES.map(s =>
      `<button class="chip" data-audit="${u}-${s}">${u}-${s} · ${S.items.filter(i => i.unit === u && i.shelf === s).length}</button>`)).join("")}</div>`;
  const list = a.shelf === "ALL" ? S.items.slice() : S.items.filter(i => shelfOf(i) === a.shelf);
  const done = Object.keys(a.marks).length;
  if (a.finished){
    const missing = list.filter(i => a.marks[i.id] === "no");
    return `<div class="sec-h"><h2>Shelf ${a.shelf} audited</h2><span>${list.length} checked · ${missing.length} not found</span></div>
      ${missing.length ? `<p class="chips-label">Not on the shelf</p>
        ${missing.map(i => row(i, i.out ? `<span class="tagx">out</span>` : `<span class="tagx bad">missing</span>`)).join("")}
        <button class="go" style="margin-top:16px" data-act="flagmissing">Flag the ${missing.filter(i => !i.out).length} unaccounted as missing</button>`
        : `<div class="empty"><b>Everything's there</b>Shelf ${a.shelf} is fully accounted for.</div>`}
      <button class="ghost" data-act="auditdone">Finish</button>`;
  }
  return `<div class="sec-h"><h2>Shelf ${a.shelf}</h2><span>${done} of ${list.length} checked</span></div>
    <div class="prog"><i style="width:${list.length ? done / list.length * 100 : 0}%"></i></div>
    ${list.map(i => row(i, `<span class="two" style="gap:6px">
      <button class="mini ok" data-mark="${i.id}:yes" ${a.marks[i.id] === "yes" ? 'style="opacity:.5"' : ""}>Here</button>
      <button class="mini no" data-mark="${i.id}:no" ${a.marks[i.id] === "no" ? 'style="opacity:.5"' : ""}>Nope</button></span>`)).join("")}
    <button class="go" style="margin-top:16px" data-act="auditfinish">Finish the walk</button>
    <button class="ghost" data-act="auditdone">Cancel</button>`;
}

function bulkView(){

      <p class="chips-label">${S.sel.length} of ${list.length} selected</p>

        <button class="ghost" style="margin-top:0" data-act="selnone">Clear</button>
      </div>
      ${list.map(i => row(i, `<button class="mini ${S.sel.includes(i.id) ? "ok" : ""}" data-sel="${i.id}">${S.sel.includes(i.id) ? "✓" : "＋"}</button>`)).join("")}
      <p class="chips-label">Move to</p>
      <div class="chips" style="flex-wrap:wrap">${UNITS.flatMap(u => SHELVES.map(s =>

   Sheets

function sheet(){
  if (!S.sheet) return "";
  const [mode, id] = S.sheet;
  const it = byId(id);
  if (!it) return "";
  let body = "";
  if (mode === "checkout"){
    body = `<h3>Check out</h3><p class="sub">${esc(it.name)} · Shelf ${esc(it.unit)}-${esc(it.shelf)}</p>
      <div class="pend" style="margin-bottom:16px"><b>Back on the shelf tonight</b>
        <small>Your name stays on it until it's back — anyone can check it in for you</small></div>
      <button class="go" data-confirm="${it.id}">Take it — it's on ${esc(S.user.name.split(" ")[0])}</button>
      <button class="ghost" data-act="closesheet">Cancel</button>`;
  } else if (mode === "checkin"){
    const spot = shelfOf(it);
    body = `<h3>Where did it go?</h3><p class="sub">${esc(it.name)} \u00b7 was on ${esc(spot)}</p>
      <button class="go" data-inspot="${it.id}:${spot}">Back on ${esc(spot)} \u2014 same spot</button>
      <p class="chips-label">Put it somewhere else?</p>
      <div class="chips" style="flex-wrap:wrap;margin-bottom:6px">
        ${UNITS.flatMap(u => SHELVES.map(s => u + "-" + s)).filter(k => k !== spot)
          .map(k => `<button class="chip" data-inspot="${it.id}:${k}">${k}</button>`).join("")}</div>
      <p class="note">Pick the shelf it's actually on. Everyone sees the new spot.</p>
      <button class="ghost" data-act="closesheet">Cancel</button>`;
  } else if (mode === "report"){
    const canClear = it.flag && isStaff();
    body = `<h3>${canClear ? "Resolve issue" : "Report a problem"}</h3><p class="sub">${esc(it.name)}</p>
      ${canClear ? `<div class="flagbar" style="margin-bottom:16px"><span>⚑</span><span><b>${esc(it.flag.type)}</b>
          ${it.flag.note ? esc(it.flag.note) + "<br>" : ""}<small>${esc(it.flag.by)} · ${fmtDate(it.flag.at)}</small></span></div>
        <button class="go" data-clear="${it.id}">Mark it resolved</button>` : ""}
      ${lastHands(it).length ? `<p class="chips-label" style="margin:0 0 10px">Last people to have it</p>
        <div class="hist" style="margin-bottom:16px">${lastHands(it).map(l => `<div><time>${fmtDate(l.at)}</time>${esc(l.text)}</div>`).join("")}</div>` : ""}
      ${FLAGS.map(f => `<button class="opt" data-pick="${f}" aria-pressed="${S.pick === f}">${f}</button>`).join("")}
      <div style="margin:12px 0"><input id="fnote" placeholder="Anything else? (optional)"
        style="width:100%;padding:14px;border-radius:15px;background:rgba(255,255,255,.06);border:1px solid var(--edge);color:#fff"></div>
      <button class="go" data-flag="${it.id}">Send report</button>
      <button class="ghost" data-act="closesheet">Cancel</button>`;
  } else if (mode === "history"){
    const log = (it.log || []).slice().reverse();
    body = `<h3>Who had it</h3><p class="sub">${esc(it.name)} · Shelf ${esc(it.unit)}-${esc(it.shelf)}</p>
      ${log.length ? `<div class="hist">${log.map(l => `<div><time>${fmtDate(l.at)}</time>${esc(l.text)}</div>`).join("")}</div>`
        : `<div class="empty" style="margin:0"><b>No trail yet</b>Once people start checking this out, every hand it passes through lands here.</div>`}
      <button class="ghost" data-act="closesheet">Close</button>`;
  } else if (mode === "edit"){
    body = `<h3>Edit item</h3><p class="sub">${esc(it.id)}</p>
      <div class="fld"><label>Item name</label><input id="e-name" value="${esc(it.name)}"></div>
      <div class="fld"><label>Category</label><select id="e-cat">${CATS.map((c, i) => `<option value="${i}" ${i === it.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>
      <div class="fld two">
        <div><label>Unit</label><select id="e-unit">${UNITS.map(u => `<option ${it.unit === u ? "selected" : ""}>${u}</option>`).join("")}</select></div>
        <div><label>Shelf</label><select id="e-shelf">${SHELVES.map(s => `<option ${+it.shelf === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      </div>
      <div class="fld"><label>What's inside (searchable)</label><input id="e-in" value="${esc(it.contents || "")}" placeholder="ping pong balls, cups"></div>
      <div class="fld"><label>Notes</label><textarea id="e-notes">${esc(it.notes)}</textarea></div>
      <div class="fld"><label>Symbol</label>
        <div class="emojigrid">
          <button class="ebtn wide" data-pick="auto" aria-pressed="${S.pick === "auto" || (!S.pick && !it.emoji)}">Auto ${emojiFor({ ...it, emoji: "" })}</button>
          ${PICKER.map(e => `<button class="ebtn" data-pick="${e}" aria-pressed="${S.pick === e || (!S.pick && it.emoji === e)}">${e}</button>`).join("")}
        </div></div>
      <button class="go" data-save="${it.id}">Save changes</button>
      <button class="ghost warn" data-del="${it.id}">Delete this item</button>
      <button class="ghost" data-act="closesheet">Cancel</button>`;
  }
  return `<div class="scrim" data-scrim><div class="sheet"><div class="grab"></div>${body}</div></div>`;
}

/* =======================================================
   Actions
   ======================================================= */
function checkOut(id){
  const it = byId(id); if (!it || it.out) return;
  it.out = { by: S.user.name, at: todayISO() };
  logIt(it, "Checked out by " + S.user.name);
  S.sheet = null; save(); render();
  toast(it.name + " is on " + S.user.name.split(" ")[0] + " \u2014 back tonight");
}
function checkIn(id, quiet, spot){
  const it = byId(id); if (!it || !it.out) return;
  const owner = it.out.by, self = owner === S.user.name, was = shelfOf(it);
  let moved = false;
  if (spot && spot !== was){
    const [u, s] = spot.split("-");
    it.unit = u; it.shelf = +s; moved = true;
  }
  logIt(it, "Checked in by " + S.user.name + (self ? "" : " (was " + owner + "'s)")
    + (moved ? " \u00b7 moved " + was + " \u2192 " + shelfOf(it) : ""));
  it.out = null;
  S.sheet = null;
  if (!quiet){
    save(); render();
    toast(moved ? it.name + " now lives on " + shelfOf(it) + " \u2014 everyone sees it"
      : it.name + " is back on " + shelfOf(it));
  }
}
function returnAll(list, label){
  if (!list.length) return;
  list.forEach(i => checkIn(i.id, true));
  save(); render(); toast(list.length + " item" + (list.length === 1 ? "" : "s") + " back on the shelves" + (label ? " · " + label : ""));
}
function sendFlag(id){
  const it = byId(id); if (!it) return;
  if (!S.pick) return toast("Pick what's wrong first");
  const note = ($("#fnote") && $("#fnote").value.trim()) || "";
  it.flag = { type: S.pick, note, by: S.user.name, at: todayISO() };
  logIt(it, "Reported " + S.pick.toLowerCase() + " by " + S.user.name + (note ? " \u2014 " + note : ""));
  S.sheet = null; S.pick = null; save(); render(); toast("Reported — staff can see it");
}
function clearFlag(id){
  const it = byId(id); if (!it || !it.flag) return;
  logIt(it, "Issue resolved by " + S.user.name);
  it.flag = null; S.sheet = null; save(); render(); toast("Marked resolved");
}
function saveEdit(id){
  const it = byId(id); if (!it) return;
  const name = $("#e-name").value.trim();
  if (name.length < 2) return toast("Give the item a name");
  const moved = it.unit !== $("#e-unit").value || +it.shelf !== +$("#e-shelf").value;
  it.name = name; it.cat = +$("#e-cat").value; it.unit = $("#e-unit").value;
  it.shelf = +$("#e-shelf").value; it.notes = $("#e-notes").value.trim();
  it.contents = $("#e-in").value.trim();
  if (S.pick) it.emoji = S.pick === "auto" ? "" : S.pick;
  logIt(it, moved ? "Moved to " + shelfOf(it) + " by " + S.user.name : "Edited by " + S.user.name);
  S.pick = null; S.sheet = null; save(); render(); toast("Saved");
}
function delItem(id){
  const it = byId(id); if (!it) return;
  if (!confirm('Delete "' + it.name + '" from the inventory?')) return;
  S.items = S.items.filter(x => x.id !== id);
  S.sheet = null; save(); render(); toast("Deleted " + it.name);
}
function newId(){ return "CAB-" + String(S.items.reduce((m, i) => Math.max(m, +i.id.slice(4) || 0), 0) + 1).padStart(4, "0"); }
function addItem(){
  const name = $("#a-name").value.trim();
  if (name.length < 2){ $("#a-name").focus(); return toast("Give the item a name"); }
  const it = { id: newId(), name, cat: +$("#a-cat").value, unit: $("#a-unit").value, shelf: +$("#a-shelf").value,
    team: "", contents: $("#a-in").value.trim(), notes: $("#a-notes").value.trim(),
    emoji: "", out: null, flag: null, log: [] };
  logIt(it, "Added by " + S.user.name);
  S.items.push(it);
  save(); S.page = "search"; S.q = name; S.browse = null; render(); toast("Added " + name);
}
function doMove(){
  if (!S.sel.length) return toast("Pick some items first");
  if (!S.dest) return toast("Pick where they're going");
  const [u, s] = S.dest.split("-");
  S.sel.forEach(id => { const it = byId(id); if (it){ it.unit = u; it.shelf = +s; logIt(it, "Moved to " + S.dest + " by " + S.user.name); } });
  const n = S.sel.length;
  S.sel = []; save(); render(); toast(n + " item" + (n === 1 ? "" : "s") + " now on " + S.dest);
}
function flagMissing(){
  const a = S.audit; if (!a) return;
  const gone = S.items.filter(i => (a.shelf === "ALL" || shelfOf(i) === a.shelf) && a.marks[i.id] === "no" && !i.out);
  gone.forEach(i => {
    i.flag = { type: "Missing", note: "Not on the shelf during the " + fmtDate(todayISO()) + " audit", by: S.user.name, at: todayISO() };
    logIt(i, "Missing at audit of " + a.shelf);
  });
  S.audit = null; S.page = "issues"; save(); render(); toast(gone.length + " flagged as missing");
}
function exportCSV(){
  const head = ["ID","Item name","Category","Shelving unit","Shelf","Team","Inside","Notes","Status","Out with","Since","Flag"];
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const csv = [head.map(q).join(",")].concat(S.items.map(i => [i.id, i.name, CATS[i.cat] || "", i.unit ? "Shelf " + i.unit : "", i.shelf,
    i.team, i.contents || "", i.notes, i.out ? "Checked out" : "Available", i.out ? i.out.by : "",
    i.out ? i.out.at : "", i.flag ? i.flag.type : ""].map(q).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "cab-inventory-" + todayISO() + ".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Exported " + S.items.length + " rows");
}
function importPaste(){
  const raw = ($("#imp") && $("#imp").value) || "";
  const lines = raw.split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length) return toast("Paste some rows first");
  let added = 0, skipped = 0;
  lines.forEach(line => {
    const p = line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x => x.replace(/^"|"$/g, "").trim());
    const name = p[0];
    if (!name || /^item ?name$/i.test(name)) return;
    const cat = CATS.findIndex(c => c.toLowerCase() === String(p[1] || "").toLowerCase());
    const unit = String(p[2] || "").replace(/shelf/i, "").trim().toUpperCase();
    const shelf = parseInt(p[3], 10);
    if (S.items.some(i => i.name.toLowerCase() === name.toLowerCase() && i.unit === unit && +i.shelf === shelf)){ skipped++; return; }
    const it = { id: newId(), name, cat: cat < 0 ? 25 : cat, unit: UNITS.includes(unit) ? unit : "",
      shelf: shelf >= 1 && shelf <= 5 ? shelf : "", team: p[4] || "", contents: "", notes: p[5] || "",
      emoji: "", out: null, flag: null, log: [] };
    logIt(it, "Imported by " + S.user.name);
    S.items.push(it); added++;
  });
  save(); render();
  toast(added + " added" + (skipped ? " · " + skipped + " already on file" : ""));
}
function copy(text, msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast(msg)).catch(() => toast("Couldn't copy"));
  } else toast("Copying isn't available here");
}
function toast(msg){
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* =======================================================
   Render + events
   ======================================================= */
function render(){
  const r = $("#root");
  if (!S.user){ r.innerHTML = loginView(); return; }
  const view = { search: searchView, away: awayView, out: outView,
    more: moreView, audit: auditView, bulk: bulkView, sync: syncView, add: addView, issues: issuesView, list: listView }[S.page] || searchView;
  r.innerHTML = bar() + `<main>${view()}</main>` + nav() + sheet();
  const q = $("#q");
  if (q && S.q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-team],[data-who],[data-act],[data-page],[data-in],[data-inspot],[data-inshelf],[data-sheet],[data-browse],[data-pick],[data-confirm],[data-flag],[data-clear],[data-save],[data-del],[data-audit],[data-mark],[data-bulk],[data-sel],[data-dest],[data-lf],[data-lsort],[data-mark2],[data-scrim]");
  if (!t) return;
  const d = t.dataset;
  if (t.hasAttribute("data-scrim")){ if (e.target === t){ S.sheet = null; S.pick = null; render(); } return; }
  if (d.team){ S.pick = d.team; S.who = null; return render(); }
  if (d.who){ S.who = d.who; return render(); }
  if (d.act === "signin") return signIn();
  if (d.act === "signout") return signOut();
  if (d.act === "closesheet"){ S.sheet = null; S.pick = null; return render(); }
  if (d.page){ S.page = d.page; if (d.page === "search") S.q = ""; if (d.page === "bulk"){ S.sel = []; S.browse = null; S.dest = null; } render(); window.scrollTo(0, 0); return; }
  if (d.browse){ const [k, v] = d.browse.split(":"); S.browse = (S.browse && S.browse[0] === k && String(S.browse[1]) === v) ? null : [k, v]; return render(); }
  if (d.sheet){ S.sheet = d.sheet.split(":"); S.pick = null; return render(); }
  if (t.hasAttribute("data-pick")){ S.pick = d.pick; return render(); }
  if (d.confirm) return checkOut(d.confirm);
  if (d.in) return checkIn(d.in);
  if (d.inspot){ const [id, spot] = d.inspot.split(":"); return checkIn(id, false, spot); }
  if (d.inshelf) return returnAll(S.items.filter(i => i.out && shelfOf(i) === d.inshelf && (isStaff() || i.out.by === S.user.name)), "Shelf " + d.inshelf);
  if (d.flag) return sendFlag(d.flag);
  if (d.clear) return clearFlag(d.clear);
  if (d.save) return saveEdit(d.save);
  if (d.del) return delItem(d.del);
  if (d.audit){ S.audit = { shelf: d.audit, marks: {}, finished: false }; return render(); }
  if (d.mark){ const [id, v] = d.mark.split(":"); S.audit.marks[id] = v; return render(); }
  if (d.bulk){ S.browse = ["bulk", d.bulk]; S.sel = []; return render(); }
  if (d.sel){ S.sel = S.sel.includes(d.sel) ? S.sel.filter(x => x !== d.sel) : S.sel.concat(d.sel); return render(); }
  if (d.dest){ S.dest = d.dest; return render(); }
  if (d.lf){ S.lf = d.lf; return render(); }
  if (d.lsort){ S.lsort = d.lsort; return render(); }
  if (d.mark2){ const [id, v] = d.mark2.split(":");
    if (S.check[id] === v) delete S.check[id]; else S.check[id] = v;
    return render(); }
  switch (d.act){
    case "add": return addItem();
    case "export": return exportCSV();
    case "import": return importPaste();
    case "auditfinish": S.audit.finished = true; return render();
    case "auditdone": S.audit = null; return render();
    case "flagmissing": return flagMissing();
    case "selall": { const src = S.browse && S.browse[1]; S.sel = S.items.filter(i => shelfOf(i) === src).map(i => i.id); return render(); }
    case "selnone": S.sel = []; return render();
    case "domove": return doMove();
    case "checkstart": S.check = {}; S.lf = "all"; return render();
    case "checkstop": S.check = null; S.lf = "all"; return render();
    case "checkfinish": return finishCheck();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){ S.q = e.target.value; S.browse = null; render(); }
  if (e.target.id === "lq"){ S.lq = e.target.value; render(); const el = $("#lq"); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.sheet){ S.sheet = null; S.pick = null; render(); }
  if (e.key === "Enter" && !S.user && S.who) signIn();
});

(async function boot(){
  render(); // show something immediately while Supabase loads
  const items = await loadItems();
  S.items = items.length ? items : buildSeed();
  if (!items.length) save(); // empty database (e.g. seed SQL not run yet) — push the built-in seed
  const sraw = sessionStore.get(SKEY);
  try { S.user = sraw ? JSON.parse(sraw) : null; } catch(e){ S.user = null; }
  if (S.user && S.user.name){
    const p = findPerson(S.user.name);
    S.user = p ? { name: p[0], team: p[1], position: p[2] } : null;
  } else S.user = null;
  render();
})();
</script>
